services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    restart: unless-stopped

    ports:
      - "29092:29092"   # host-reachable listener -- use this from scripts run directly on your machine (not inside Docker)

    environment:
      # KRaft 
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MjNmODJlZDYtY2Q5Yi00

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      # PLAINTEXT (kafka:9092) is what other containers use to reach it.
      # PLAINTEXT_HOST (localhost:29092) is what scripts on your Windows host use.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # a browsable UI for topics/messages at http://localhost:8085
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  postgres:
    image: postgis/postgis:17-3.5
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: grievance
      POSTGRES_PASSWORD: grievance
      POSTGRES_DB: grievance_db

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grievance -d grievance_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: complaint-service/Dockerfile

    working_dir: /workspace

    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/packages/shared/node_modules

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://grievance:grievance@postgres:5432/grievance_db

    command: >
      sh -c "
      npm run db:migrate
      "

    restart: "no"

  complaint-service:
    build:
      context: .
      dockerfile: complaint-service/Dockerfile

    working_dir: /workspace/complaint-service

    command: sh -c "npm run dev"

    depends_on:
          migrate:
            condition: service_completed_successfully

    ports:
      - "5001:5001"

    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/packages/shared/node_modules
      - /workspace/complaint-service/node_modules

  gis-service:
    build:
      context: .
      dockerfile: gis-service/Dockerfile

    working_dir: /workspace/gis-service

    command: sh -c "npm run dev"

    depends_on:
      migrate:
        condition: service_completed_successfully

    ports:
      - "3000:3000"

    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/packages/shared/node_modules
      - /workspace/gis-service/node_modules

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    working_dir: /workspace/frontend

    command: npm run dev -- --host 0.0.0.0

    depends_on:
      - complaint-service
      - gis-service

    ports:
      - "5173:5173"

    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/frontend/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  postgres-data:
  kafka-data: