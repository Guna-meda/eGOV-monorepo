services:
  postgres:
    image: postgis/postgis:17-3.5

    container_name: complaint-postgres

    environment:
      POSTGRES_USER: grievance
      POSTGRES_PASSWORD: grievance
      POSTGRES_DB: grievance_db

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: