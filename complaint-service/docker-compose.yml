services:
  postgres:
    image: postgres:17
    container_name: complaint-postgres

    environment:
      POSTGRES_USER: grievance
      POSTGRES_PASSWORD: grievance
      POSTGRES_DB: grievance_db

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: complaint-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: